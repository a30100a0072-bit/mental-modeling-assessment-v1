#:schema https://updates.wrangler.dev/config-schema.json
name = "mental-modeling-assessment-v1"
main = "src/index.ts"
compatibility_date = "2026-04-06"

# 注意：本 repo 是 worker (main + routes + migrations 都在本檔) + pages (靜態 public/)
# 混合架構。曾嘗試加 `pages_build_output_dir = "public"` 讓 `wrangler pages deploy`
# 找到輸出目錄，但 wrangler 4.94 對該欄位 + worker 設定共存採嚴格拒絕：deploy 失敗
# ("Configuration file for Pages projects does not support main/routes/migrations") +
# Windows 上 libuv assertion crash。回到沒設 pages_build_output_dir 的狀態，Pages
# deploy 顯示 missing-field 訊息但會 ignore wrangler.toml 並用 CLI args (--project-name +
# public/) 成功部署 — 這是目前可用的混合架構解。

# 【雲端警衛設定】攔截所有發向 mbti.chiyigo.com/api/ 的請求，轉交給這個 Worker 處理
routes = [
  { pattern = "mbti.chiyigo.com/api/*", zone_name = "chiyigo.com" }
]

[vars]
ENGINE_VERSION = "V1"
# SSO 跨站跳轉白名單（逗號分隔），新增網站只需修改此行並重新 deploy
SSO_ALLOWED_ORIGINS = "https://talo.chiyigo.com"

[[kv_namespaces]]
binding = "MM_CACHE_KV"
id = "4f7f301984454c84b36e93a2f238b8e9"

[[d1_databases]]
binding = "MM_DB_D1"
database_name = "mm_assessment_db"
database_id = "d462765e-1c16-473e-9b7b-ed6bf319d383"
migrations_dir = "migrations"

# MM_EVENT_QUEUE 自始未實際發送任何 message（producer 未綁、consumer handler 只 console.log），
# 2026-05-16 health audit 砍除。若未來需要事件 pipeline 再從 wrangler.toml + src/index.ts 同時加回。

# AssessmentSession Durable Object 從未實際使用，v2 migration 將其刪除。
# 保留 v1 tag 作為歷史紀錄，wrangler 會比對 tag 差異判斷需執行哪些 DO migration。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AssessmentSession"]

[[migrations]]
tag = "v2"
deleted_classes = ["AssessmentSession"]

[observability]
enabled = true